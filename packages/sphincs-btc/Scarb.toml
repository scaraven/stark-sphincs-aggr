[package]
name = "sphincs_btc"
version = "0.1.0"
edition = "2024_07"

[lib]

[[target.executable]]
name = "main_multi"
function = "sphincs_btc::main_multi"

[[target.executable]]
name = "main"
function = "sphincs_btc::main"


[dependencies]
cairo_execute = "2.11.4"
sphincs_core = { path = "../sphincs-core" }

[dev-dependencies]
cairo_test = "2.11.4"

[features]
default = ["blake_hash"]
blake_hash = []
debug = []
